# ⚠ Энэ файл main ба ажлын branch (feature/**) дээр ЯГ ИЖИЛ байна — merge хийхэд
# өөрчлөгдөхгүй. Image tag нь push хийсэн branch-аас автоматаар гарна ("/" → "-"):
# main → :main, feature/v1.2.0 → :feature-v1.2.0, dev → :dev.
name: Build & Push ADMIN (dev)

on:
  push:
    branches:
      - main
      - "feature/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: usukhbaya12/hire-admin

jobs:
  # №9-L0 / №15-P1: улаан тест image-ийг гаргахгүй. Тестүүд зөвхөн Node (npm install шаардахгүй):
  # api-boundary (browser core-г шууд дуудахгүй), exam-answers / exam-resume / exam-actions (web).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag (branch → tag)
        id: tag
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build & Push ADMIN
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
